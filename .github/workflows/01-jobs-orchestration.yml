name: L3 Jobs Orchestration
run-name: ${{ github.actor }} L3 (jobs 编排)

# 核心演示：多个 job 的依赖（needs）、传值（outputs）、条件跳过（if）。
# 观察 Actions 页面的可视化：job 会连成一条线，串行/并行一目了然。

on: [push, workflow_dispatch]

jobs:
  # ---------- 并行组：没有 needs 的 job 同时开跑 ----------
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo "检查代码风格…通过"

  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "跑单元测试…通过"

  # ---------- 串行：等 lint 和 test 都成功才跑 ----------
  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    outputs:
      # 注意：这里用 steps 上下文（jobs.<自己> 不可用，会造成自引用校验失败）
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        run: echo "version=1.3.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - run: echo "构建 version=${{ steps.meta.outputs.version }}"

  # ---------- 条件 job：只在 main 且由 push 触发时部署 ----------
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "部署 ${{ needs.build.outputs.version }} 到生产环境"

  # ---------- 条件 job 的另一半：PR 上只"预演"不部署 ----------
  deploy-dryrun:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR 预演：跳过真实部署"
